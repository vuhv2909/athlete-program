<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lịch tập tuần — Lean Athletic & Match Simulation</title>
<style>
  :root{
    --ink:#12161c;
    --ink-2:#1b212a;
    --line:#2b333f;
    --paper:#f2f4f3;
    --mute:#8d98a7;
    --fb-a:#5ad19a;
    --fb-b:#5aa9f0;
    --fb-c:#a78bfa;
    --rest:#a4adba;
    --cardio:#f2b84b;
    --match:#ff6b4a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:"Inter","Segoe UI",system-ui,sans-serif;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:40px 24px 80px}

  header{
    display:flex;flex-wrap:wrap;align-items:flex-end;
    justify-content:space-between;gap:16px;
    padding-bottom:24px;border-bottom:1px solid var(--line);
  }
  h1{
    font-size:clamp(24px,4.2vw,38px);
    font-weight:800;letter-spacing:-.03em;margin:0;
  }
  .sub{color:var(--mute);font-size:14px;margin:6px 0 0}
  .counter{
    font-variant-numeric:tabular-nums;
    font-size:14px;color:var(--mute);
    border:1px solid var(--line);border-radius:999px;
    padding:8px 16px;white-space:nowrap;
  }
  .counter b{color:var(--paper);font-size:18px}

  nav{display:flex;gap:8px;overflow-x:auto;padding:20px 0 4px;scrollbar-width:thin}
  nav button{
    flex:0 0 auto;cursor:pointer;
    background:transparent;color:var(--mute);
    border:1px solid var(--line);border-radius:10px;
    padding:10px 16px;font:inherit;font-size:14px;font-weight:600;
    display:flex;align-items:center;gap:9px;
    transition:color .15s,border-color .15s,background .15s;
  }
  nav button .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.9}
  nav button[data-type=fba]{color:var(--fb-a)}
  nav button[data-type=fbb]{color:var(--fb-b)}
  nav button[data-type=fbc]{color:var(--fb-c)}
  nav button[data-type=cardio]{color:var(--cardio)}
  nav button[data-type=match]{color:var(--match)}
  nav button[data-type=rest]{color:var(--rest)}
  nav button:hover{border-color:currentColor}
  nav button[aria-selected=true]{background:currentColor;border-color:currentColor}
  nav button[aria-selected=true] span:not(.dot){color:var(--ink)}
  nav button[aria-selected=true] .dot{background:var(--ink)}
  nav button:focus-visible{outline:2px solid var(--paper);outline-offset:2px}

  .day{display:none;padding-top:28px}
  .day.active{display:block}

  .day-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:4px}
  .day-head h2{margin:0;font-size:26px;letter-spacing:-.02em}
  .flow{color:var(--mute);font-size:14px;margin:0 0 24px}

  .block{margin-bottom:28px}
  .block > h3{
    margin:0 0 12px;font-size:13px;font-weight:700;
    letter-spacing:.04em;color:var(--mute);
    display:flex;align-items:center;gap:10px;
  }
  .block > h3::after{content:"";flex:1;height:1px;background:var(--line)}

  ol.ex{list-style:none;margin:0;padding:0;counter-reset:n}
  ol.ex li{counter-increment:n}
  ol.ex label{
    display:flex;align-items:center;gap:14px;cursor:pointer;
    padding:13px 16px;border:1px solid var(--line);border-radius:12px;
    margin-bottom:8px;background:var(--ink-2);
    transition:border-color .15s,opacity .15s;
  }
  ol.ex label:hover{border-color:var(--mute)}
  ol.ex .num{
    font-variant-numeric:tabular-nums;font-size:12px;
    color:var(--mute);min-width:18px;
  }
  ol.ex input{
    appearance:none;-webkit-appearance:none;margin:0;
    width:20px;height:20px;flex:0 0 20px;border-radius:6px;
    border:1.5px solid var(--line);background:transparent;cursor:pointer;
    display:grid;place-content:center;
  }
  ol.ex input::after{
    content:"";width:10px;height:6px;
    border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);
    transform:rotate(-45deg) scale(0);transition:transform .12s;
  }
  ol.ex input:checked{background:var(--accent);border-color:var(--accent)}
  ol.ex input:checked::after{transform:rotate(-45deg) scale(1)}
  ol.ex input:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
  ol.ex .name{font-weight:500}
  ol.ex input:checked ~ .name{text-decoration:line-through;color:var(--mute)}
  ol.ex .tag{
    margin-left:auto;font-size:12px;color:var(--mute);
    border:1px solid var(--line);border-radius:6px;padding:2px 8px;white-space:nowrap;
  }

  .cardio{
    border:1px solid var(--accent);border-radius:12px;padding:18px 20px;
    background:color-mix(in srgb,var(--accent) 8%,transparent);
    margin-bottom:12px;
  }
  .cardio h4{margin:0 0 6px;font-size:16px}
  .cardio p{margin:0;color:var(--mute);font-size:14px;white-space:pre-line}

  .rest-card{
    border:1px dashed var(--line);border-radius:14px;
    padding:48px 24px;text-align:center;
  }
  .rest-card p{margin:8px 0 0;color:var(--mute)}
  .rest-card .big{font-size:22px;font-weight:700;color:var(--paper)}

  .actions{margin-top:32px;padding-top:20px;border-top:1px solid var(--line)}
  .reset{
    background:transparent;border:1px solid var(--line);color:var(--mute);
    border-radius:10px;padding:9px 16px;font:inherit;font-size:14px;cursor:pointer;
  }
  .reset:hover{color:var(--paper);border-color:var(--mute)}

  @media (max-width:520px){
    .wrap{padding:28px 16px 60px}
    ol.ex .tag{display:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>Lịch tập tuần — Lean Athletic</h1>
      <p class="sub">3 Full Body (2 Sets to Failure) • 2 Zone 2 Recovery • 1 Match Day 90 Phút • 1 Nghỉ</p>
    </div>
    <div class="counter" id="counter">Buổi này: <b>0</b>/0 bài</div>
  </header>

  <nav id="nav" role="tablist" aria-label="Chọn ngày"></nav>

  <main id="days"></main>

  <div class="actions">
    <button class="reset" id="reset">Bỏ đánh dấu tất cả</button>
  </div>
</div>

<script>
const PLAN = [
  {
    id:"t2", label:"Thứ 2", type:"fba", title:"Full Body A + Zone 2",
    flow:"Khởi động (5p) → Tạ (35p) → Incline Walking (30p)",
    blocks:[
      {name:"Bài tập (Khởi động riêng, 2 working sets to failure)", items:[
        {n:"DB Flat Bench Press", tag:"2 × 6–8"},
        {n:"Lat Pulldown", tag:"2 × 6–8"},
        {n:"Bulgarian Split Squat / Leg Press", tag:"2 × 8–10/chân"},
        {n:"DB Lateral Raise", tag:"2 × 12–15"},
        {n:"Ab Wheel Rollout / Plank", tag:"2 × 8–12"}
      ]}
    ],
    cardio:{
      title:"Incline Walking Zone 2 — 30 phút", 
      desc:"• Dốc: 8% – 10%\n• Tốc độ: 4.0 km/h\n• Không vịn tay, thở mũi đều."
    }
  },
  {
    id:"t3", label:"Thứ 3", type:"cardio", title:"Zone 2 Recovery (60 Phút)",
    flow:"Không tập tạ → Incline walking Zone 2",
    cardio:{
      title:"Incline Walking Zone 2 — 60 phút",
      desc:"• Dốc: 8% – 10%\n• Tốc độ: 4.0 km/h\n• Không vịn tay, duy trì nhịp tim Zone 2 liên tục."
    }
  },
  {
    id:"t4", label:"Thứ 4", type:"fbb", title:"Full Body B + Zone 2",
    flow:"Khởi động (5p) → Tạ (40p) → Incline Walking (30p)",
    blocks:[
      {name:"Bài tập (Khởi động riêng, 2 working sets to failure)", items:[
        {n:"Incline DB Bench Press", tag:"2 × 8–10"},
        {n:"1-Arm Cable Row", tag:"2 × 8–10/bên"},
        {n:"Single-Leg RDL", tag:"2 × 8–10/chân"},
        {n:"Lying / Seated Leg Curl", tag:"2 × 10–12"},
        {n:"1-Arm DB Shoulder Press", tag:"2 × 8–10/bên"},
        {n:"Incline DB Curl", tag:"2 × 8–10"}
      ]}
    ],
    cardio:{
      title:"Incline Walking Zone 2 — 30 phút", 
      desc:"• Dốc: 8% – 10%\n• Tốc độ: 4.0 km/h\n• Không vịn tay, hạ nhiệt cơ bắp."
    }
  },
  {
    id:"t5", label:"Thứ 5", type:"cardio", title:"Zone 2 Recovery (75–90 Phút)",
    flow:"Không tập tạ → Incline walking Zone 2",
    cardio:{
      title:"Incline Walking Zone 2 — 75 đến 90 phút",
      desc:"• Dốc: 8% – 10%\n• Tốc độ: 4.0 km/h\n• Không vịn tay, thở mũi đều đặn, bù đủ nước khoáng."
    }
  },
  {
    id:"t6", label:"Thứ 6", type:"fbc", title:"Full Body C (Dưỡng Chân Cho Thứ 7)",
    flow:"Khởi động (5p) → Tạ thân trên & bắp chân (30p) → Incline Walking (20p)",
    blocks:[
      {name:"Bài tập (2 working sets to failure — không tập đùi nặng)", items:[
        {n:"Cable Chest Fly", tag:"2 × 10–12"},
        {n:"Face Pull / Reverse Fly", tag:"2 × 12–15"},
        {n:"Standing Calf Raise", tag:"2 × 12–15"},
        {n:"Triceps Rope Pushdown", tag:"2 × 10–12"},
        {n:"Cable Pallof Press", tag:"2 × 10–12/bên"}
      ]}
    ],
    cardio:{
      title:"Incline Walking thả lỏng — 20–25 phút", 
      desc:"• Dốc: 6% – 8%\n• Tốc độ: 4.0 km/h\n• Bước chậm rãi thư giãn."
    }
  },
  {
    id:"t7", label:"Thứ 7", type:"match", title:"Match Simulation (90 Phút)",
    flow:"Khởi động (10p) → Hiệp 1 (45p) → Nghỉ (10p) → Hiệp 2 (35p)",
    cardio:{
      title:"Công thức 90 phút (Max speed 12 km/h)",
      desc:"• KHỞI ĐỘNG (10p): 5p dốc 1% chạy 4.5 → 7.0 km/h + 5p giãn cơ.\n\n• HIỆP 1 (45p — Dốc 3% cố định):\nLặp lại chu kỳ 5 phút (×9 lần):\n  - 2:00: Đi bộ 5.0–5.5 km/h\n  - 1:30: Chạy 9.5–10.5 km/h\n  - 0:30: Sprint 12.0 km/h\n  - 1:00: Đi bộ 4.0 km/h\n\n• NGHỈ GIỮA HIỆP (10p): Uống 250ml nước dừa / điện giải, đi lại nhẹ nhàng.\n\n• HIỆP 2 (35p — Dốc 8% cố định):\nLặp lại chu kỳ 6 phút (×5 lần):\n  - 4:00: Đi bộ dốc 5.0–5.5 km/h\n  - 1:00: Chạy dốc 8.5–9.5 km/h\n  - 1:00: Đi bộ chậm 3.8–4.0 km/h\nBù giờ (5p): Hạ dốc 0%, đi bộ 4.0 → 3.0 km/h."
    }
  },
  {
    id:"cn", label:"Chủ nhật", type:"rest", title:"Nghỉ Ngơi Hoàn Toàn",
    flow:"Phục hồi hệ thần kinh, tái tạo cơ bắp và trục nội tiết",
    rest:true
  }
];

const COLOR = {fba:"var(--fb-a)", fbb:"var(--fb-b)", fbc:"var(--fb-c)", cardio:"var(--cardio)", match:"var(--match)", rest:"var(--rest)"};
const nav = document.getElementById("nav");
const days = document.getElementById("days");
const counter = document.getElementById("counter");

PLAN.forEach((d)=>{
  const b = document.createElement("button");
  b.type="button"; b.role="tab"; b.dataset.type=d.type; b.dataset.id=d.id;
  b.setAttribute("aria-selected","false");
  b.innerHTML = `<span class="dot"></span><span>${d.label}</span>`;
  b.addEventListener("click",()=>select(d.id));
  nav.appendChild(b);

  const s = document.createElement("section");
  s.className="day"; s.id="day-"+d.id;
  s.style.setProperty("--accent", COLOR[d.type]);

  let html = `<div class="day-head"><h2>${d.label} — ${d.title}</h2></div>`;
  if(d.flow) html += `<p class="flow">${d.flow}</p>`;

  if(d.rest){
    html += `<div class="rest-card"><div class="big">Nghỉ Hoàn Toàn</div>
      <p>Không tập gym, không cardio. Ngủ sâu giấc, nạp đủ đạm, mỡ tốt và tinh bột sạch.</p></div>`;
  } else {
    (d.blocks||[]).forEach(bl=>{
      html += `<div class="block"><h3>${bl.name}</h3><ol class="ex">`;
      bl.items.forEach((it,idx)=>{
        const name = typeof it==="string"?it:it.n;
        const tag = typeof it==="string"?"":`<span class="tag">${it.tag}</span>`;
        html += `<li><label><span class="num">${String(idx+1).padStart(2,"0")}</span>
          <input type="checkbox"><span class="name">${name}</span>${tag}</label></li>`;
      });
      html += `</ol></div>`;
    });
    if(d.cardio){
      html += `<div class="block"><h3>Nội dung Tim Mạch / Chạy bộ</h3><div class="cardio">
        <h4>${d.cardio.title}</h4><p>${d.cardio.desc}</p></div></div>`;
    }
  }
  s.innerHTML = html;
  s.addEventListener("change",updateCount);
  days.appendChild(s);
});

function select(id){
  nav.querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected", b.dataset.id===id));
  days.querySelectorAll(".day").forEach(s=>s.classList.toggle("active", s.id==="day-"+id));
  updateCount();
}
function updateCount(){
  const cur = days.querySelector(".day.active");
  if(!cur) return;
  const all = cur.querySelectorAll('input[type=checkbox]');
  const done = cur.querySelectorAll('input[type=checkbox]:checked').length;
  counter.innerHTML = all.length
    ? `Buổi này: <b>${done}</b>/${all.length} bài`
    : `Hôm nay: <b>Cardio / Nghỉ</b>`;
}
document.getElementById("reset").addEventListener("click",()=>{
  days.querySelectorAll('input[type=checkbox]').forEach(c=>c.checked=false);
  updateCount();
});

const todayIdx = (new Date().getDay()+6)%7; // 0 = Thứ 2
select(PLAN[todayIdx].id);
</script>
</body>
</html>
