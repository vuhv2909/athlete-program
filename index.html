<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lịch tập tuần</title>
<style>
  :root{
    --ink:#12161c;
    --ink-2:#1b212a;
    --line:#2b333f;
    --paper:#f2f4f3;
    --mute:#8d98a7;
    --push:#5ad19a;
    --pull:#5aa9f0;
    --legs:#f4685f;
    --rest:#a4adba;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:"Inter","Segoe UI",system-ui,sans-serif;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:40px 24px 80px}

  header{
    display:flex;flex-wrap:wrap;align-items:flex-end;
    justify-content:space-between;gap:16px;
    padding-bottom:24px;border-bottom:1px solid var(--line);
  }
  h1{
    font-size:clamp(30px,5vw,46px);
    font-weight:800;letter-spacing:-.03em;margin:0;
  }
  .sub{color:var(--mute);font-size:14px;margin:6px 0 0}
  .counter{
    font-variant-numeric:tabular-nums;
    font-size:14px;color:var(--mute);
    border:1px solid var(--line);border-radius:999px;
    padding:8px 16px;white-space:nowrap;
  }
  .counter b{color:var(--paper);font-size:18px}

  nav{display:flex;gap:8px;overflow-x:auto;padding:20px 0 4px;scrollbar-width:thin}
  nav button{
    flex:0 0 auto;cursor:pointer;
    background:transparent;color:var(--mute);
    border:1px solid var(--line);border-radius:10px;
    padding:10px 16px;font:inherit;font-size:14px;font-weight:600;
    display:flex;align-items:center;gap:9px;
    transition:color .15s,border-color .15s,background .15s;
  }
  nav button .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.9}
  nav button[data-type=push]{color:var(--push)}
  nav button[data-type=pull]{color:var(--pull)}
  nav button[data-type=legs]{color:var(--legs)}
  nav button[data-type=rest]{color:var(--rest)}
  nav button:hover{border-color:currentColor}
  nav button[aria-selected=true]{background:currentColor;border-color:currentColor}
  nav button[aria-selected=true] span:not(.dot){color:var(--ink)}
  nav button[aria-selected=true] .dot{background:var(--ink)}
  nav button:focus-visible{outline:2px solid var(--paper);outline-offset:2px}

  .day{display:none;padding-top:28px}
  .day.active{display:block}

  .day-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:4px}
  .day-head h2{margin:0;font-size:28px;letter-spacing:-.02em}
  .flow{color:var(--mute);font-size:14px;margin:0 0 26px}

  .block{margin-bottom:30px}
  .block > h3{
    margin:0 0 12px;font-size:13px;font-weight:700;
    letter-spacing:.04em;color:var(--mute);
    display:flex;align-items:center;gap:10px;
  }
  .block > h3::after{content:"";flex:1;height:1px;background:var(--line)}

  ol.ex{list-style:none;margin:0;padding:0;counter-reset:n}
  ol.ex li{counter-increment:n}
  ol.ex label{
    display:flex;align-items:center;gap:14px;cursor:pointer;
    padding:13px 16px;border:1px solid var(--line);border-radius:12px;
    margin-bottom:8px;background:var(--ink-2);
    transition:border-color .15s,opacity .15s;
  }
  ol.ex label:hover{border-color:var(--mute)}
  ol.ex .num{
    font-variant-numeric:tabular-nums;font-size:12px;
    color:var(--mute);min-width:18px;
  }
  ol.ex input{
    appearance:none;-webkit-appearance:none;margin:0;
    width:20px;height:20px;flex:0 0 20px;border-radius:6px;
    border:1.5px solid var(--line);background:transparent;cursor:pointer;
    display:grid;place-content:center;
  }
  ol.ex input::after{
    content:"";width:10px;height:6px;
    border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);
    transform:rotate(-45deg) scale(0);transition:transform .12s;
  }
  ol.ex input:checked{background:var(--accent);border-color:var(--accent)}
  ol.ex input:checked::after{transform:rotate(-45deg) scale(1)}
  ol.ex input:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
  ol.ex .name{font-weight:500}
  ol.ex input:checked ~ .name{text-decoration:line-through;color:var(--mute)}
  ol.ex .tag{
    margin-left:auto;font-size:12px;color:var(--mute);
    border:1px solid var(--line);border-radius:6px;padding:2px 8px;white-space:nowrap;
  }

  .cardio{
    border:1px solid var(--accent);border-radius:12px;padding:18px 20px;
    background:color-mix(in srgb,var(--accent) 8%,transparent);
  }
  .cardio h4{margin:0 0 6px;font-size:16px}
  .cardio p{margin:0;color:var(--mute);font-size:14px}
  .cardio .big{
    font-size:15px;color:var(--paper);font-variant-numeric:tabular-nums;
    margin-top:10px;display:flex;gap:20px;flex-wrap:wrap;
  }
  .note{color:var(--mute);font-size:14px;font-style:italic}

  .rest-card{
    border:1px dashed var(--line);border-radius:14px;
    padding:48px 24px;text-align:center;
  }
  .rest-card p{margin:8px 0 0;color:var(--mute)}
  .rest-card .big{font-size:22px;font-weight:700;color:var(--paper)}

  .actions{margin-top:32px;padding-top:20px;border-top:1px solid var(--line)}
  .reset{
    background:transparent;border:1px solid var(--line);color:var(--mute);
    border-radius:10px;padding:9px 16px;font:inherit;font-size:14px;cursor:pointer;
  }
  .reset:hover{color:var(--paper);border-color:var(--mute)}

  @media (max-width:520px){
    .wrap{padding:28px 16px 60px}
    ol.ex .tag{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>Lịch tập tuần</h1>
      <p class="sub">Push · Pull · Legs — 6 buổi, nghỉ chủ nhật</p>
    </div>
    <div class="counter" id="counter">Hôm nay: <b>0</b>/0 bài</div>
  </header>

  <nav id="nav" role="tablist" aria-label="Chọn ngày"></nav>

  <main id="days"></main>

  <div class="actions">
    <button class="reset" id="reset">Bỏ đánh dấu tất cả</button>
  </div>
</div>

<script>
const PLAN = [
  {
    id:"t2", label:"Thứ 2", type:"push", title:"Push + Zone 2",
    flow:"Warm-up → Push → Zone 2",
    blocks:[
      {name:"Sức mạnh", items:[
        "DB Bench Press","Single-arm DB Shoulder Press","Incline DB Press",
        "Cable Chest Fly","Lateral Raise",{n:"Explosive Push-up",tag:"bùng nổ"}
      ]}
    ],
    cardio:{title:"Zone 2 — 30 phút", desc:"Nhịp tim đều, vẫn nói chuyện được."}
  },
  {
    id:"t3", label:"Thứ 3", type:"pull", title:"Pull + Zone 2",
    flow:"Warm-up → Pull → Zone 2",
    blocks:[
      {name:"Sức mạnh", items:[
        "Lat Pulldown","Single-arm Cable Row","Single-arm Lat Pulldown",
        "Face Pull","Reverse Fly",{n:"Suitcase Carry",tag:"chống xoay"},"Core"
      ]}
    ],
    cardio:{title:"Zone 2 — 30 phút", desc:"Nhịp tim đều, vẫn nói chuyện được."}
  },
  {
    id:"t4", label:"Thứ 4", type:"legs", title:"Legs + Bùng nổ + Hill HIIT",
    flow:"Warm-up → Bùng nổ → Legs → Hill",
    blocks:[
      {name:"Bùng nổ", items:["Jump Squat","Lateral Bound"]},
      {name:"Sức mạnh", items:[
        "Bulgarian Split Squat","Single-leg RDL","Hip Thrust","Leg Curl","Calf Raise","Core"
      ]}
    ],
    cardio:{title:"Hill HIIT", desc:"Không cần Zone 2 hôm nay.",
      stats:["12 km/h","Dốc 12%","20s mạnh / 60s hồi","8 hiệp"]}
  },
  {
    id:"t5", label:"Thứ 5", type:"push", title:"Push + Zone 2",
    flow:"Warm-up → Push → Zone 2",
    blocks:[
      {name:"Sức mạnh", items:[
        "Incline DB Press","DB Bench Press","Single-arm Cable Press",
        "Single-arm Shoulder Press","Lateral Raise",{n:"Explosive Push-up",tag:"bùng nổ"}
      ]}
    ],
    cardio:{title:"Zone 2 — 30 phút", desc:"Nhịp tim đều, vẫn nói chuyện được."}
  },
  {
    id:"t6", label:"Thứ 6", type:"pull", title:"Pull + Zone 2",
    flow:"Warm-up → Pull → Zone 2",
    blocks:[
      {name:"Sức mạnh", items:[
        "Seated Cable Row","Lat Pulldown","Single-arm Cable Row","Face Pull / Reverse Fly"
      ]},
      {name:"Core", items:[
        {n:"Suitcase Carry",tag:"chống xoay"},"Woodchop","Side Plank"
      ]}
    ],
    cardio:{title:"Zone 2 — 30 phút", desc:"Nhịp tim đều, vẫn nói chuyện được."}
  },
  {
    id:"t7", label:"Thứ 7", type:"legs", title:"Legs + Bùng nổ + Hill HIIT",
    flow:"Warm-up → Bùng nổ → Legs → Hill",
    blocks:[
      {name:"Bùng nổ", items:["Jump Squat","Lateral Bound"]},
      {name:"Sức mạnh", items:[
        "Leg Press","Reverse Lunge","Single-leg RDL","Hip Thrust","Leg Curl","Calf Raise"
      ]}
    ],
    cardio:{title:"Hill HIIT", desc:"Không cần Zone 2 hôm nay.",
      stats:["12 km/h","Dốc 12%","20s mạnh / 60s hồi","8 hiệp"]}
  },
  {
    id:"cn", label:"Chủ nhật", type:"rest", title:"Nghỉ",
    flow:"", rest:true
  }
];

const COLOR = {push:"var(--push)", pull:"var(--pull)", legs:"var(--legs)", rest:"var(--rest)"};
const nav = document.getElementById("nav");
const days = document.getElementById("days");
const counter = document.getElementById("counter");

PLAN.forEach((d,i)=>{
  const b = document.createElement("button");
  b.type="button"; b.role="tab"; b.dataset.type=d.type; b.dataset.id=d.id;
  b.setAttribute("aria-selected","false");
  b.innerHTML = `<span class="dot"></span><span>${d.label}</span>`;
  b.addEventListener("click",()=>select(d.id));
  nav.appendChild(b);

  const s = document.createElement("section");
  s.className="day"; s.id="day-"+d.id;
  s.style.setProperty("--accent", COLOR[d.type]);

  let html = `<div class="day-head"><h2>${d.label} — ${d.title}</h2></div>`;
  if(d.flow) html += `<p class="flow">${d.flow}</p>`;

  if(d.rest){
    html += `<div class="rest-card"><div class="big">Nghỉ hoàn toàn</div>
      <p>Ngủ đủ, ăn đủ đạm, đi bộ nhẹ nếu thấy bí chân.</p></div>`;
  } else {
    (d.blocks||[]).forEach(bl=>{
      html += `<div class="block"><h3>${bl.name}</h3><ol class="ex">`;
      bl.items.forEach((it,idx)=>{
        const name = typeof it==="string"?it:it.n;
        const tag = typeof it==="string"?"":`<span class="tag">${it.tag}</span>`;
        html += `<li><label><span class="num">${String(idx+1).padStart(2,"0")}</span>
          <input type="checkbox"><span class="name">${name}</span>${tag}</label></li>`;
      });
      html += `</ol></div>`;
    });
    if(d.cardio){
      html += `<div class="block"><h3>Cardio</h3><div class="cardio">
        <h4>${d.cardio.title}</h4><p>${d.cardio.desc}</p>` +
        (d.cardio.stats?`<div class="big">${d.cardio.stats.map(s=>`<span>${s}</span>`).join("")}</div>`:"") +
        `</div></div>`;
    } else if(d.noCardio){
      html += `<p class="note">${d.noCardio}</p>`;
    }
  }
  s.innerHTML = html;
  s.addEventListener("change",updateCount);
  days.appendChild(s);
});

function select(id){
  nav.querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected", b.dataset.id===id));
  days.querySelectorAll(".day").forEach(s=>s.classList.toggle("active", s.id==="day-"+id));
  updateCount();
}
function updateCount(){
  const cur = days.querySelector(".day.active");
  if(!cur) return;
  const all = cur.querySelectorAll('input[type=checkbox]');
  const done = cur.querySelectorAll('input[type=checkbox]:checked').length;
  counter.innerHTML = all.length
    ? `Buổi này: <b>${done}</b>/${all.length} bài`
    : `Hôm nay: <b>nghỉ</b>`;
}
document.getElementById("reset").addEventListener("click",()=>{
  days.querySelectorAll('input[type=checkbox]').forEach(c=>c.checked=false);
  updateCount();
});

const todayIdx = (new Date().getDay()+6)%7; // 0 = thứ 2
select(PLAN[todayIdx].id);
</script>
</body>
</html>
